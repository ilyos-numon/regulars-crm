# Cloud Run 서비스 regulars-crm (Knative Service 형식). 공개 데모 모드로 돈다.
# 적용: deploy/gcp/apply-env.sh 가 ${IMAGE}·${PROJECT_ID} 를 채워 gcloud run services replace 한다. 자동 배포는 이미지만 바꾼다.
# 비용: 요청이 없으면 인스턴스 0 (minScale 0), 최대 1 (maxScale 1), 요청 처리 중에만 CPU (cpu-throttling true).
# 데이터는 컨테이너 안 /app/data (인스턴스가 내려가면 사라진다). 방문자 데이터는 REGULARS_DEMO_TTL_HOURS 뒤 지운다.
# 시작 확인은 /health 를 쓴다. /healthz 는 Cloud Run 이 앱에 넘기지 않는다.
# 비밀 REGULARS_HASH_SALT 는 Secret Manager 에서 읽는다 (버전 latest).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: regulars-crm
  labels:
    cloud.googleapis.com/location: asia-northeast3
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: regulars-crm-run@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: "${IMAGE}"
          ports:
            - name: http1
              containerPort: 8790
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8790
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: REGULARS_DEMO_MODE
              value: "1"
            - name: REGULARS_DATA_DIR
              value: "/app/data"
            - name: REGULARS_DEMO_TTL_HOURS
              value: "24"
            - name: REGULARS_DEMO_SWEEP_MINUTES
              value: "10"
            - name: REGULARS_DEMO_MAX_VISITORS
              value: "30"
            - name: TZ
              value: "Asia/Seoul"
            - name: REGULARS_HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: REGULARS_HASH_SALT
                  key: latest
