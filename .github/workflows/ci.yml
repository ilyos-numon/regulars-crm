name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run tests/unit

      # 두 Playwright 묶음은 test-results/ 를 함께 쓰므로 순서대로 돌린다.
      - name: E2E tests
        run: npx playwright test

      - name: Demo mode E2E tests
        run: npx playwright test -c playwright.demo.config.ts
